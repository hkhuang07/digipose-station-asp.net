version: '3.8'

services:
  digipose-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digipose-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
    restart: always

  digipose-web:
    build:
      context: ./backend/DigiPOSE
      dockerfile: Dockerfile
    container_name: digipose-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=digipose-db,1433;Database=DigiPoseDb;User Id=sa;Password=YourStrongPassword123!;Encrypt=True;TrustServerCertificate=True;
    ports:
      - "5000:80"
    depends_on:
      - digipose-db
    volumes:
      - digipose_uploads:/app/wwwroot/uploads
    restart: always

volumes:
  sqldata:
  digipose_uploads:
